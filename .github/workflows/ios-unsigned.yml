name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "ios/**"
    paths:
      - "expo/**"
      - "android/app/src/main/cpp/**"
      - "assets/**"
      - ".github/workflows/ios-unsigned.yml"
    tags:
      - "ios-unsigned-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: expo
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Select newest installed stable Xcode
        run: python3 ios-compat/select-xcode.py
      - name: Check current iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes
      - name: Install dependencies and check TypeScript and native rules
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test
          bash native/recognition/tests/run.sh
      - name: Generate iOS project and install pods
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          node ios-compat/validate-project.cjs
      - name: Build unsigned device app
        run: |
          set -o pipefail
          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          [[ ${#workspaces[@]} -eq 1 ]] || { echo "::error::Expected one iOS workspace"; exit 1; }
          scheme="$(basename "${workspaces[0]}" .xcworkspace)"
          xcodebuild \
            -workspace "${workspaces[0]}" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/ios-xcodebuild.log"
      - name: Validate device app and package IPA
        run: |
          shopt -s nullglob
          apps=("$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/"*.app)
          [[ ${#apps[@]} -eq 1 ]] || { echo "::error::Expected one Release device app"; exit 1; }
          app="${apps[0]}"
          test -s "$app/main.jsbundle"
          platform="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$app/Info.plist")"
          [[ "$platform" == iPhoneOS ]] || { echo "::error::Not a device build"; exit 1; }
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo "$app/$executable" -verify_arch arm64
          python3 ios-compat/validate-app.py "$app"
          python3 - "$app" <<'PY'
          import json, pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          config = json.loads(pathlib.Path('app.json').read_text())['expo']
          target = next(p[1]['ios']['deploymentTarget'] for p in config['plugins']
                        if isinstance(p, list) and p[0] == 'expo-build-properties')
          def version(value):
              parts = tuple(map(int, value.split('.')))
              return parts + (0,) * (3 - len(parts))
          for path in [app / 'Info.plist', *app.glob('Frameworks/*.framework/Info.plist'),
                       *app.glob('PlugIns/*.appex/Info.plist'), *app.glob('PlugIns/*.appex/Frameworks/*.framework/Info.plist') ]:
              info = plistlib.loads(path.read_bytes())
              minimum = info.get('MinimumOSVersion')
              assert minimum or path.parent != app, 'App MinimumOSVersion is missing'
              if minimum:
                  assert version(minimum) <= version(target), f'{path}: requires iOS {minimum}, expected <= {target}'
                  print(f'{path.parent.name}: minimum iOS {minimum}')
          PY
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/unsigned-ipa/Payload/$(basename "$app")"
          ditto -c -k --keepParent "$RUNNER_TEMP/unsigned-ipa/Payload" "$RUNNER_TEMP/naruto-timer-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/naruto-timer-unsigned.ipa"
          cd "$RUNNER_TEMP"
          shasum -a 256 naruto-timer-unsigned.ipa > naruto-timer-unsigned.ipa.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: naruto-timer-ios-unsigned-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/naruto-timer-unsigned.ipa
            ${{ runner.temp }}/naruto-timer-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ios-xcodebuild.log
            expo/ios/Podfile.lock
            expo/ios/*/Info.plist
            expo/ios/*.xcodeproj/project.pbxproj
          retention-days: 7
